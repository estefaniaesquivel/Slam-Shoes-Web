# Nombre de tu aplicación backend
spring.application.name=slam-shoes-backend

# Conexión a Supabase (PostgreSQL) 
spring.datasource.url=jdbc:postgresql://db.ckparlqrfkzofsvskmbw.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=Holiwis123!

# ~ Driver JDBC de PostgreSQL ~
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA para tablas creadas manualmente 
# Cambiamos a 'none' para que Hibernate NO modifique ni cree tablas automáticamente. 
# Respeta 100% las 7 tablas creadas en Supabase.
spring.jpa.hibernate.ddl-auto=none

# Dialecto de PostgreSQL 
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logs de SQL en consola 
# Muy útil para ver las consultas reales que genera Spring Boot hacia Supabase
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto del servidor backend
server.port=8080


