<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

    <!-- Encabezado -->
    <nav class="navbar navbar-expand-lg border-bottom">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="PrimeraEntrega.html">[LOGO]</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse justify-content-center" id="menuPrincipal">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="PrimeraEntrega.html">Novedades</a></li>
                    <li class="nav-item"><a class="nav-link" href="PrimeraEntrega.html">Básquetbol</a></li>
                    <li class="nav-item"><a class="nav-link" href="PrimeraEntrega.html">Ropa</a></li>
                    <li class="nav-item"><a class="nav-link" href="PrimeraEntrega.html">Ofertas</a></li>
                </ul>
            </div>

            <div class="d-flex align-items-center gap-3">
                <a href="#"><i class="bi bi-search text-dark"></i></a>
                <a href="login.html"><i class="bi bi-person text-dark"></i></a>
                <!-- carrito con el contador -->
                <a href="#offcanvasCarrito" data-bs-toggle="offcanvas" class="position-relative text-dark text-decoration-none" aria-label="Abrir carrito">
                    <i class="bi bi-bag"></i>
                    <span id="contador-carrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.6rem;">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- seccion de autentificacion -->
    <div class="container my-5 py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="border p-4 text-center">
                    <h3 class="mb-4">[Iniciar Sesión]</h3>
                    
                    <form id="form-login" class="text-start">
                        <div class="mb-3">
                            <label class="form-label">[Correo electrónico]</label>
                            <input type="email" class="form-control" id="inputCorreo" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">[Contraseña]</label>
                            <input type="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-dark w-100">[Ingresar]</button>
                    </form>
                    
                    <div class="mt-4">
                        <!-- enlaces extra -->
                        <a href="#" class="text-secondary text-decoration-none small">[¿Olvidaste tu contraseña?]</a><br>
                        <a href="#" class="text-secondary text-decoration-none small">[Crear cuenta nueva]</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- pie -->
    <footer class="border-top pt-4 pb-2 mt-auto fixed-bottom bg-white">
        <div class="container text-center">
            <div class="row mb-3">
                <div class="col">
                    <a href="#" class="mx-2 text-dark">[Enlace pie 1]</a>
                    <a href="#" class="mx-2 text-dark">[Enlace pie 2]</a>
                    <a href="#" class="mx-2 text-dark">[Enlace pie 3]</a>
                </div>
            </div>
            <p class="mb-0 text-muted">[Texto xd sit seven]</p>
        </div>
    </footer>

    <!-- Panel lateral del carrito -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasCarrito" aria-labelledby="offcanvasCarritoLabel">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title" id="offcanvasCarritoLabel">Carrito de compras</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <div id="lista-carrito" class="flex-grow-1 overflow-auto">
                <!-- Se llena con JavaScript -->
            </div>
            <div class="border-top pt-3 mt-auto">
                <div class="d-flex justify-content-between fw-bold mb-3">
                    <span>Total:</span>
                    <span id="total-carrito">$0.00 MXN</span>
                </div>
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-danger btn-sm" id="btn-vaciar-carrito">Vaciar carrito</button>
                    <button class="btn btn-dark" id="btn-comprar">Continuar compra</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="carrito.js"></script>

    <!-- funcionalidad de autentificacion -->
    <script>
        document.getElementById('form-login').addEventListener('submit', function(e) {
            e.preventDefault();
            const correo = document.getElementById('inputCorreo').value;
            alert('Sesión iniciada con: ' + correo);
            window.location.href = 'PrimeraEntrega.html'; // regresa al index simulando que ya entro
        });
    </script>
</body>
</html>
