<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Slam Shoes</title>
 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-dark text-light d-flex flex-column min-vh-100">

    <!-- Encabezado -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
        <div class="container-fluid px-4">
            <!-- Imagen del logo -->
            <a class="navbar-brand" href="index.html">
                <img src="logo-slamshoes-blanco.png" alt="Slam Shoes Logo" style="height: 50px; width: auto;" class="object-contain">         
            </a>
 

            <div class="d-flex align-items-center gap-3">
                <a href="#" class="text-light fs-5"><i class="bi bi-search"></i></a>
                <a href="login.html" class="text-light fs-5"><i class="bi bi-person"></i></a>
                <!-- carrito con el contador -->
                <a href="#offcanvasCarrito" data-bs-toggle="offcanvas" class="position-relative text-light text-decoration-none fs-5" aria-label="Abrir carrito">
                    <i class="bi bi-bag"></i>
                    <span id="contador-carrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.6rem;">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- seccion de autentificacion -->
    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="border border-secondary bg-black p-4 text-center rounded shadow-lg">
                    <h3 class="mb-4 text-light">Iniciar Sesión</h3>
                    
                    <form id="form-login" class="text-start">
                        <div class="mb-3">
                            <label class="form-label text-light">Correo electrónico</label>
                            <input type="email" class="form-control bg-dark text-light border-secondary" id="inputCorreo" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-light">Contraseña</label>
                            <input type="password" class="form-control bg-dark text-light border-secondary" required>
                        </div>
                        <button type="submit" class="btn btn-light w-100 fw-semibold">Ingresar</button>
                    </form>
                    
                    <div class="mt-4">
                        <!-- enlaces extra -->
                        <a href="#" class="text-secondary text-decoration-none small d-block mb-1">¿Olvidaste tu contraseña?</a>
                        <a href="#" class="text-secondary text-decoration-none small d-block">Crear cuenta nueva</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- pie -->
    <footer class="border-top border-secondary bg-dark pt-4 pb-2 mt-auto">
        <div class="container text-center">
            <div class="row mb-3">
                <div class="col">
                    <a href="#" class="mx-2 text-secondary text-decoration-none">[Enlace pie 1]</a>
                    <a href="#" class="mx-2 text-secondary text-decoration-none">[Enlace pie 2]</a>
                    <a href="#" class="mx-2 text-secondary text-decoration-none">[Enlace pie 3]</a>
                </div>
            </div>
            <p class="mb-0 text-muted">[Texto xd sit seven]</p>
        </div>
    </footer>

    <!-- Panel lateral del carrito -->
    <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasCarrito" aria-labelledby="offcanvasCarritoLabel">
        <div class="offcanvas-header border-bottom border-secondary">
            <h5 class="offcanvas-title" id="offcanvasCarritoLabel">Carrito de compras</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <div id="lista-carrito" class="flex-grow-1 overflow-auto">
                <!-- Se llena con JavaScript -->
            </div>
            <div class="border-top border-secondary pt-3 mt-auto">
                <div class="d-flex justify-content-between fw-bold mb-3">
                    <span>Total:</span>
                    <span id="total-carrito" class="text-success">$0.00 MXN</span>
                </div>
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-danger btn-sm" id="btn-vaciar-carrito">Vaciar carrito</button>
                    <button class="btn btn-light" id="btn-comprar">Continuar compra</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="carrito.js"></script>

    <!-- funcionalidad de autentificacion -->
    <script>
        document.getElementById('form-login').addEventListener('submit', function(e) {
            e.preventDefault();
            const correo = document.getElementById('inputCorreo').value;
            alert('Sesión iniciada con: ' + correo);
            window.location.href = 'index.html'; // regresa al index simulando que ya entro
        });
    </script>
</body>
</html>
