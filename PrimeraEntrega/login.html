<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

    <!-- Encabezado -->
    <nav class="navbar navbar-expand-lg border-bottom">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="index.html">[LOGO]</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse justify-content-center" id="menuPrincipal">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Novedades</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html">Básquetbol</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html">Ropa</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html">Ofertas</a></li>
                </ul>
            </div>

            <div class="d-flex align-items-center gap-3">
                <a href="#"><i class="bi bi-search text-dark"></i></a>
                <a href="login.html"><i class="bi bi-person text-dark"></i></a>
                <a href="index.html" class="text-dark"><i class="bi bi-bag"></i></a>
            </div>
        </div>
    </nav>

    <!-- seccion de autentificacion -->
    <div class="container my-5 py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="border p-4 text-center">
                    <h3 class="mb-4">[Iniciar Sesión]</h3>
                    
                    <form id="form-login" class="text-start">
                        <div class="mb-3">
                            <label class="form-label">[Correo electrónico]</label>
                            <input type="email" class="form-control" id="inputCorreo" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">[Contraseña]</label>
                            <input type="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-dark w-100">[Ingresar]</button>
                    </form>
                    
                    <div class="mt-4">
                        <!-- enlaces extra -->
                        <a href="#" class="text-secondary text-decoration-none small">[¿Olvidaste tu contraseña?]</a><br>
                        <a href="#" class="text-secondary text-decoration-none small">[Crear cuenta nueva]</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- pie -->
    <footer class="border-top pt-4 pb-2 mt-auto fixed-bottom bg-white">
        <div class="container text-center">
            <div class="row mb-3">
                <div class="col">
                    <a href="#" class="mx-2 text-dark">[Enlace pie 1]</a>
                    <a href="#" class="mx-2 text-dark">[Enlace pie 2]</a>
                    <a href="#" class="mx-2 text-dark">[Enlace pie 3]</a>
                </div>
            </div>
            <p class="mb-0 text-muted">[Texto xd sit seven]</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- funcionalidad de autentificacion -->
    <script>
        document.getElementById('form-login').addEventListener('submit', function(e) {
            e.preventDefault();
            const correo = document.getElementById('inputCorreo').value;
            alert('Sesión iniciada con: ' + correo);
            window.location.href = 'PrimeraEntrega.html'; // regresa al index simulando que ya entro
        });
    </script>
</body>
</html>
